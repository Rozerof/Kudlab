name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: kudlab_j02_ci_test
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:local_test_only@localhost:5432/kudlab_j02_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    env:
      VITE_API_ORIGIN: https://kudlab-docente.pages.dev
      VITE_PLAY_ORIGIN: https://kudlab-play.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: node --test tests/pages/proxy.test.mjs

  play:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: play } }
    env:
      VITE_API_ORIGIN: https://kudlab-api.example
      VITE_TEACHER_ORIGIN: https://kudlab-docente.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: play/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
